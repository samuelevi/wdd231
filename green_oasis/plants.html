<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore our digital plant directory featuring flora from the Green Oasis Community Garden.">
    <meta name="author" content="Web Development Student">
    <title>Plant Directory | Green Oasis Community Garden</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/plants.css">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans&family=Lato:wght@600&display=swap" rel="stylesheet">

    <meta property="og:title" content="Green Oasis Garden - Home">
    <meta property="og:description" content="Welcome to Green Oasis Community Garden - A sanctuary for urban gardening and community growth.">
    <meta property="og:image" content="https://samuelevi.github.io/wdd231/green_oasis/images/hero-garden.jpg">
    <meta property="og:url" content="https://green_oasis.example.com/">
    <meta property="og:type" content="website">
</head>
<body>
    <header>
        <div class="container">
            <h1>Green Oasis Community Garden</h1>
            <p>Digital Plant Catalog</p>
        </div>
    </header>

    <nav>
        <div class="container nav-container">
            <button id="menu-toggle" aria-label="Toggle navigation">☰</button>
            <ul class="nav-links" id="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="plants.html" class="active">Plant Directory</a></li>
                <li><a href="join.html">Join the Garden</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <section>
            <h2>Explore Our Flora</h2>
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All Plants</button>
                <button class="filter-btn" data-filter="Vegetable">Vegetables</button>
                <button class="filter-btn" data-filter="Herb">Herbs</button>
            </div>
            
            <div id="plant-grid" class="plant-grid">
                <!-- Plants will be dynamically loaded here -->
            </div>
        </section>

        <!-- Modal for Plant Details -->
        <div id="plant-modal" class="modal" aria-hidden="true">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <div id="modal-body">
                    <!-- Dynamic modal content -->
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Green Oasis Community Garden | <a href="attributions.html">Attributions</a></p>
            <p><a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener noreferrer">Project Demonstration Video</a></p>
        </div>
    </footer>

    <script src="scripts/plants.js" type="module"></script>
    <script src="scripts/main.js" type="module"></script>
</body>
</html>
